<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ringkasan Pelaporan Kekayaan PN/WL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
html, body {
  height: 100%;
  margin: 0;
}

body {
  background: #f8f9fa;
}

.dashboard {
  height: 100vh;
  padding: 10px 16px;
  display: flex;
  flex-direction: column;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.table-wrapper {
  flex: 1;
  overflow-y: auto;
}

table {
  width: 100%;
}

.table.main-table,
.table.main-table > :not(caption) > * > * {
  background-color: #f8f9fa !important;
}

td {
  padding: 4px 4px;           /* COMPACT ROWS */
  vertical-align: middle;
  font-size: 11.5px;          /* SMALLER TEXT */
}

td.no {
  width: 34px;
  text-align: center;
  color: #666;
}

td.unit {
  width: 70%;
  font-weight: 500;
}

td.progress-col {
  width: 30%;
}

.progress {
  height: 22px;               /* COMPACT BAR */
  border-radius: 6px;
  background: #e9ecef;
}

.progress-bar {
  font-size: 11.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
}

.badge-lhkpn {
  background-color: #ffc107;  /* BOOTSTRAP YELLOW */
  color: #000;
  font-size: 11px;
  font-weight: 500;
  padding: 4px 6px;
  border-radius: 6px;
  margin-left: 6px;
  white-space: nowrap;
}
</style>
</head>

<body>
<div class="dashboard">

  <!-- HEADER -->
  <div class="header">
    <h6 class="mb-0">
      <i class="fa-solid fa-chart-line text-success"></i>
      Progress Wajib Lapor
    </h6>

    <div class="d-flex gap-2 align-items-center">
      <button id="btnCapture" class="btn btn-sm btn-outline-secondary">
        <i class="fa-solid fa-camera"></i>
      </button>

      <select id="fileSelect" class="form-select form-select-sm" style="width:320px;"></select>
    </div>

  </div>

  <!-- TABLE -->
  <div class="table-wrapper p-3">
    <table class="table main-table table-sm table-borderless mb-0">
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title text-center" id="modalTitle"></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <table class="table table-sm table-hover">
            <thead>
              <tr>
                <th style="width:40px">No</th>
                <th>Nama</th>
                <th style="width:120px">Status</th>
              </tr>
            </thead>
            <tbody id="modalTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
let rawRows = [];

/* ===============================
   MANUAL CSV LIST
   =============================== */
// const csvFiles = [
//   "Daftar Wajib Lapor 140126756.csv",
//   "Daftar Wajib Lapor 130126844.csv"
// ];

const fileSelect = document.getElementById("fileSelect");
const tableBody = document.getElementById("tableBody");

// csvFiles.forEach(file => {
//   const opt = document.createElement("option");
//   opt.value = file;
//   opt.textContent = formatLaporDate(file);
//   fileSelect.appendChild(opt);
// });

fetch("data.json")
  .then(res => res.json())
  .then(data => {
    data.files.forEach(file => {
      const opt = document.createElement("option");
      opt.value = file;
      opt.textContent = formatLaporDate(file);
      fileSelect.appendChild(opt);
    });

    // Load first file by default
    if (data.files.length > 0) {
      loadCSV(data.files[0]);
    }
  })
  .catch(err => {
    console.error("Failed to load csv-files.json", err);
  });

fileSelect.addEventListener("change", () => loadCSV(fileSelect.value));

function formatLaporDate(input) {
  // Extract digits: 140126756
  const digits = input.match(/\d+/)[0];
  
  const day = digits.substring(0, 2);
  const month = "Jan"; // Since 01 is Jan
  const year = "20" + digits.substring(4, 6);
  
  // Extract time and pad with leading zero if it's only 3 digits
  let timePart = digits.substring(6);
  if (timePart.length === 3) timePart = "0" + timePart;
  
  const hour = timePart.substring(0, 2);
  const minute = timePart.substring(2, 4);

  return `${day} ${month} ${year} - ${hour}:${minute}`;
}

fileSelect.addEventListener("change", () => loadCSV(fileSelect.value));
// loadCSV(csvFiles[0]);

/* ===============================
   LOAD CSV
   =============================== */
function loadCSV(filename) {
  fetch(filename)
    .then(res => res.text())
    .then(text => processCSV(text));
}

function processCSV(csvText) {
  const lines = csvText.trim().split("\n");
  const headers = lines[0].split(";");

  const unitIndex = headers.indexOf("UNIT KERJA");
  const statusIndex = headers.indexOf("Status Lapor");
  const lhkpnIndex = headers.indexOf("Status LHKPN\r");
  const namaIndex = headers.indexOf("NAMA");

  const data = {};
  rawRows = [];

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(";");

    const row = {
      unit: cols[unitIndex],
      status: cols[statusIndex],
      lhkpn: cols[lhkpnIndex],
      nama: cols[namaIndex]
    };
    rawRows.push(row);

    if (!data[row.unit]) {
      data[row.unit] = { total: 0, sudah: 0, perbaikan: 0 };
    }

    data[row.unit].total++;
    if (row.status === "Sudah") data[row.unit].sudah++;
    if (row.lhkpn === "Perlu Perbaikan\r") data[row.unit].perbaikan++;
  }

  renderTable(data);
}

/* ===============================
   RENDER TABLE
   =============================== */
function renderTable(data) {
  tableBody.innerHTML = "";

  const sorted = Object.entries(data).sort(
    (a, b) => (b[1].sudah / b[1].total) - (a[1].sudah / a[1].total)
  );

  sorted.forEach(([unit, val], index) => {
    let percent = Math.round((val.sudah / val.total) * 100);
    let color = getSoftColor(percent);

    let barWidth = percent;
    if (percent === 0) {
      barWidth = 100;
      color = "#dee2e6"; // bootstrap light gray
    }

    tableBody.innerHTML += `
      <tr>
        <td class="no">${index + 1}</td>
        <td class="unit">${unit}</td>
        <td class="progress-col">
          <div class="d-flex align-items-center">
            <div class="progress flex-grow-1"
                role="button"
                onclick="openProgressModal('${unit}')">
              <div class="progress-bar fw-bold"
                  style="width:${barWidth}%; background:${color};">
                ${val.sudah} / ${val.total}
              </div>
            </div>

            ${val.perbaikan > 0
              ? `<span class="badge-lhkpn fw-bold"
                      role="button"
                      onclick="openPerbaikanModal('${unit}')">
                  Perlu Perbaikan: ${val.perbaikan}
                </span>`
              : ``}
          </div>
        </td>
      </tr>
    `;
  });
}

/* ===============================
   COLOR GRADIENT
   =============================== */
function getSoftColor(percent) {
  const red = Math.round(255 - percent * 1.2);
  const green = Math.round(120 + percent * 1.2);
  return `rgb(${red}, ${green}, 140)`;
}

function openProgressModal(unit) {
  const modal = new bootstrap.Modal(document.getElementById("detailModal"));
  document.getElementById("modalTitle").textContent = unit + " - Status Lapor";

  const tbody = document.getElementById("modalTableBody");
  tbody.innerHTML = "";

  rawRows
    .filter(r => r.unit === unit)
    .forEach((r, i) => {
      const danger = r.status === "Belum" ? "table-danger" : "";
      tbody.innerHTML += `
        <tr class="${danger}">
          <td>${i + 1}</td>
          <td>${r.nama}</td>
          <td>${r.status}</td>
        </tr>
      `;
    });

  modal.show();
}

function openPerbaikanModal(unit) {
  const modal = new bootstrap.Modal(document.getElementById("detailModal"));
  document.getElementById("modalTitle").textContent = unit + " - Perlu Perbaikan";

  const tbody = document.getElementById("modalTableBody");
  tbody.innerHTML = "";

  rawRows
    .filter(r => r.unit === unit && r.lhkpn === "Perlu Perbaikan\r")
    .forEach((r, i) => {
      tbody.innerHTML += `
        <tr>
          <td>${i + 1}</td>
          <td>${r.nama}</td>
          <td>Perlu Perbaikan</td>
        </tr>
      `;
    });

  modal.show();
}

document.getElementById("btnCapture").addEventListener("click", async () => {
  const wrapper = document.querySelector(".table-wrapper");

  // Save original styles
  const originalOverflow = wrapper.style.overflow;
  const originalHeight = wrapper.style.height;

  // Expand to full height
  wrapper.style.overflow = "visible";
  wrapper.style.height = wrapper.scrollHeight + "px";

  await html2canvas(wrapper, {
    scale: 2,         // better quality
    useCORS: true
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = "progress-wajib-lapor.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  // Restore styles
  wrapper.style.overflow = originalOverflow;
  wrapper.style.height = originalHeight;
});


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
